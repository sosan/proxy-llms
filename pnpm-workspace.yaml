# pnpm security best practices
# Source: https://github.com/lirantal/npm-security-best-practices

packages:
  - .

enableGlobalVirtualStore: true

# SECURITY: block packages newer than 3 days (4320 minutes)
minimumReleaseAge: 4320

# SECURITY: reject a version whose publishing trust signals regressed
trustPolicy: no-downgrade

# SECURITY: keep strict overrides only when necessary and vetted
# trustPolicyExclude:
#   - 'chokidar@4.0.3'
#   - 'webpack@4.47.0 || 5.102.1'

# SECURITY: pnpm blocks install scripts by default, enabled explicitly for:
allowBuilds:
  esbuild: true
  rolldown: true
  sharp: true
  unrs-resolver: true
  workerd: true

# SECURITY: fail the install if a dependency wants to run a build
# script that isn't in the allow-list above
strictDepBuilds: true

# SECURITY: reject dependencies sourced from git URLs
blockExoticSubdeps: true

minimumReleaseAgeExclude:
  - '@cloudflare/vitest-pool-workers@0.16.9'
  - '@cloudflare/workerd-darwin-64@1.20260521.1'
  - '@cloudflare/workerd-darwin-arm64@1.20260521.1'
  - '@cloudflare/workerd-linux-64@1.20260521.1'
  - '@cloudflare/workerd-linux-arm64@1.20260521.1'
  - '@cloudflare/workerd-windows-64@1.20260521.1'
  - '@cloudflare/workers-types@4.20260522.1'
  # Renovate security update: hono@4.12.25
  - hono@4.12.22 || 4.12.25
  - miniflare@4.20260521.0
  - workerd@1.20260521.1
  - wrangler@4.94.0

# SECURITY: allow recent versions for dev dependencies that update frequently
# This list must be kept in sync with devDependencies in package.json
