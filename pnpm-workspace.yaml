# pnpm security best practices
# Source: https://github.com/lirantal/npm-security-best-practices

packages:
  - .

# SECURITY: block packages newer than 30 days (43200 minutes)
minimumReleaseAge: 43200

# SECURITY: reject a version whose publishing trust signals regressed
trustPolicy: no-downgrade

# SECURITY: keep strict overrides only when necessary and vetted
# trustPolicyExclude:
#   - 'chokidar@4.0.3'
#   - 'webpack@4.47.0 || 5.102.1'

# SECURITY: pnpm blocks install scripts by default, enabled explicitly for:
allowBuilds:
  esbuild: true
  rolldown: true
  sharp: true
  unrs-resolver: true
  workerd: true

# SECURITY: fail the install if a dependency wants to run a build
# script that isn't in the allow-list above
strictDepBuilds: true

# SECURITY: reject dependencies sourced from git URLs
blockExoticSubdeps: true

minimumReleaseAgeExclude:
  - '@cloudflare/kv-asset-handler@0.5.0'
  - '@cloudflare/unenv-preset@2.16.1'
  - '@cloudflare/vitest-pool-workers@0.16.8'
  - '@cloudflare/workerd-darwin-64@1.20260520.1'
  - '@cloudflare/workerd-darwin-arm64@1.20260520.1'
  - '@cloudflare/workerd-linux-64@1.20260520.1'
  - '@cloudflare/workerd-linux-arm64@1.20260520.1'
  - '@cloudflare/workerd-windows-64@1.20260520.1'
  - '@cloudflare/workers-types@4.20260521.1'
  - '@oxlint/binding-android-arm-eabi@1.66.0'
  - '@oxlint/binding-android-arm64@1.66.0'
  - '@oxlint/binding-darwin-arm64@1.66.0'
  - '@oxlint/binding-darwin-x64@1.66.0'
  - '@oxlint/binding-freebsd-x64@1.66.0'
  - '@oxlint/binding-linux-arm-gnueabihf@1.66.0'
  - '@oxlint/binding-linux-arm-musleabihf@1.66.0'
  - '@oxlint/binding-linux-arm64-gnu@1.66.0'
  - '@oxlint/binding-linux-arm64-musl@1.66.0'
  - '@oxlint/binding-linux-ppc64-gnu@1.66.0'
  - '@oxlint/binding-linux-riscv64-gnu@1.66.0'
  - '@oxlint/binding-linux-riscv64-musl@1.66.0'
  - '@oxlint/binding-linux-s390x-gnu@1.66.0'
  - '@oxlint/binding-linux-x64-gnu@1.66.0'
