# pnpm security best practices
# Source: https://github.com/lirantal/npm-security-best-practices

packages:
  - .

enableGlobalVirtualStore: true

# SECURITY: block packages newer than 3 days (4320 minutes)
minimumReleaseAge: 4320

# SECURITY: reject a version whose publishing trust signals regressed
trustPolicy: no-downgrade

# SECURITY: keep strict overrides only when necessary and vetted
# trustPolicyExclude:
#   - 'chokidar@4.0.3'
#   - 'webpack@4.47.0 || 5.102.1'

# SECURITY: pnpm blocks install scripts by default, enabled explicitly for:
allowBuilds:
  esbuild: true
  rolldown: true
  sharp: true
  unrs-resolver: true
  workerd: true

# SECURITY: fail the install if a dependency wants to run a build
# script that isn't in the allow-list above
strictDepBuilds: true

# SECURITY: reject dependencies sourced from git URLs
blockExoticSubdeps: true

# SECURITY: allow recent versions for dev dependencies that update frequently
# This list must be kept in sync with devDependencies in package.json
minimumReleaseAgeExclude:
  - '@cloudflare/vitest-pool-workers@0.16.8'
  - '@cloudflare/workers-types@4.20260520.1'
  - '@types/node@25.9.1'
  - '@vitest/coverage-v8@4.1.7'
  - '@vitest/expect@4.1.7'
  - '@vitest/mocker@4.1.7'
  - '@vitest/pretty-format@4.1.7'
  - '@vitest/runner@4.1.7'
  - '@vitest/snapshot@4.1.7'
  - '@vitest/spy@4.1.7'
  - '@vitest/utils@4.1.7'
  - hono@4.12.22
  - miniflare@4.20260520.0
  - oxlint@1.66.0
  - typescript@6.0.3
  - vitest@4.1.7
  - workerd@1.20260520.1
  - wrangler@4.93.1
  - ws@8.20.1
