name = "multi-provider-proxy"
main = "server.js"
compatibility_date = "2023-12-01"

[durable_objects]
bindings = [
  { name = "PROCESSOR", class_name = "ProcessorDurableObject" }
]

[[migrations]]
tag = "v1"
# Uncomment the above line to enable NOT free tier SQLite support for the ProcessorDurableObject
#  new_classes = ["ProcessorDurableObject"] 
new_sqlite_classes = ["ProcessorDurableObject"]

[vars]
NVIDIA_NIM_BASE_URL = "https://integrate.api.nvidia.com/v1"
DEEPSEEK_V4_PRO_MODEL = "deepseek-ai/deepseek-v4-pro"
MODEL_HAIKU = "anthropic/claude-3-haiku-20240307"
MODEL_SONNET = "anthropic/claude-3-5-sonnet-20240620"
MODEL_OPUS = "anthropic/claude-3-opus-20240229"
OPENAI_MODEL = "meta/llama-3.1-405b-instruct"