name = "proxy-llms"
main = "src/server.ts"
compatibility_date = "2026-04-21"

[durable_objects]
bindings = [
  { name = "PROCESSOR", class_name = "ProcessorDurableObject" },
  { name = "DO_RATE_LIMITER", class_name = "RateLimiterDurableObject" }
]

[[migrations]]
tag = "v1"
new_sqlite_classes = ["ProcessorDurableObject", "RateLimiterDurableObject"]

[observability]
[observability.logs]
enabled = true
invocation_logs = true

[[analytics_engine_datasets]]
binding = "ANALYTICS"
dataset = "request_metrics"

[vars]
NVIDIA_BASE_URL = "https://integrate.api.nvidia.com/v1"
OPENROUTER_BASE_URL = "https://openrouter.ai/api/v1"
OPENCODE_BASE_URL = "https://api.opencode.dev/v1"
LOG_METRICS = "true"
DEBUG = "true"
LOG_PAYLOAD = "false"
ANTHROPIC_OPUS_MODEL = "nvidia/moonshotai/kimi-k2.6"
ANTHROPIC_SONNET_MODEL = "nvidia/z-ai/glm-5.1"
ANTHROPIC_HAIKU_MODEL = ""
ANTHROPIC_DEFAULT_MODEL = ""
RTK_ENABLED = "true"
CAVEMAN_ENABLED = "true"

# Environments
[env.staging]
name = "proxy-llms-staging"

[env.staging.durable_objects]
