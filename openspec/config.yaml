schema: spec-driven

# Project context
# This is shown to AI when creating artifacts.
context: |
  Tech stack: TypeScript, Hono, Cloudflare Workers, Vitest
  Runtime: Cloudflare Workers with Durable Objects for async flows
  Primary pattern: Proxy — forward OpenAI-compatible requests to upstream LLM providers
  Key concerns: Model alias resolution, streaming SSE response preservation, error status code forwarding, provider-agnostic interface, rate limiting, metrics collection
  Package manager: pnpm (with strict supply-chain hardening)
  Testing: Vitest with mocked crypto for Node.js compatibility
  Logging: Centralized logger (utils/logger.ts) gated by DEBUG env var
  Domain: AI proxy for OpenAI-compatible clients (Cline, Claude Code, etc.)
  Architecture: Declarative routing — routes are thin wrappers, controllers contain all business logic
  Security: pnpm supply-chain hardening (ignore-scripts, allow-git=none, min-release-age, trustPolicy, frozen lockfile checks), dev containers

# Per-artifact rules (optional)
# Add custom rules for specific artifacts.
rules:
  proposal:
    - Keep proposals under 500 words
    - Always include a "Non-goals" section
    - Reference existing .claude/rules/proxy-llms.md for architectural constraints
  tasks:
    - Break tasks into chunks of max 2 hours
    - Run `pnpm run typecheck` after any TypeScript change
    - Run `pnpm run test` before finishing any non-trivial change
    - Verify routing pattern: routes/index.ts must be declarative
  design:
    - Follow the declarative routing pattern: routes are thin wrappers, controllers contain all business logic
    - Never use `register*Routes(app)` functions
    - Preserve OpenAI API compatibility in all request/response handling
    - Use the centralized logger from `utils/logger.ts` instead of raw `console.*`
