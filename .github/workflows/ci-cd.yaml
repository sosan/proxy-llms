name: CI/CD

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: package.json
          cache: pnpm

      - name: Install dependencies (deterministic)
        run: |
          pnpm install --frozen-lockfile --prefer-offline --ignore-scripts
          pnpm approve-builds esbuild sharp workerd
          pnpm rebuild

      - name: Lint lockfile
        run: pnpm run lint:lockfile

      - name: Security audit
        run: pnpm audit --audit-level=high

      - name: Lint code
        run: pnpm run lint

      - name: Type check
        run: pnpm run typecheck

      - name: Run tests
        run: pnpm run test

  deploy:
    name: Deploy
    needs: [test]
    if: |
      (github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))) ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    # GitHub Environment: creates deployment records, enables approval gates
    # (e.g., required reviewers for production), and looks up secrets first in
    # the environment, then at repository level. Repository secrets are sufficient;
    # environment secrets are optional but recommended for isolation.
    environment:
      name: ${{ github.event.inputs.environment || 'staging' }}
      url: ${{ steps.deploy.outputs.deployment-url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: package.json
          cache: pnpm

      - name: Install dependencies (deterministic)
        run: |
          pnpm install --frozen-lockfile --prefer-offline --ignore-scripts
          pnpm approve-builds esbuild sharp workerd
          pnpm rebuild

      # ------------------------------------------------------------------
      # OPTIONAL: Use Infisical to fetch runtime secrets (reference only)
      # ------------------------------------------------------------------
      # If you prefer to manage Worker runtime secrets via Infisical instead
      # of GitHub secrets, uncomment the steps below and remove the static
      # "Create Worker secrets file" step above.
      #
      # Prerequisites:
      # 1. Create an Infisical project with `staging` and `production` environments.
      # 2. Add `NVIDIA_API_KEY`, `OPENROUTER_API_KEY`, `ANALYTICS_ACCOUNT_ID`,
      #    `ANALYTICS_API_TOKEN`, `METRICS_TOKEN`, `PROXY_API_KEY` to each environment in Infisical.
      # 3. Create a Machine Identity in Infisical and generate a token.
      # 4. Store the token as `INFISICAL_TOKEN` in the GitHub environment.
      #
      # - name: Install Infisical CLI
      #   run: |
      #     curl -1sLf 'https://cli.infisical.com/install.sh' | bash
      #
      # - name: Fetch secrets from Infisical
      #   env:
      #     INFISICAL_TOKEN: ${{ secrets.INFISICAL_TOKEN }}
      #   run: |
      #     infisical export --env=${{ github.event.inputs.environment || 'staging' }} --format=dotenv > .infisical-env
      #
      # - name: Create Worker secrets file from Infisical
      #   run: |
      #     umask 077
      #     {
      #       # Pipeline credentials remain from GitHub secrets
      #       printf 'CLOUDFLARE_API_TOKEN=%s\n' '${{ secrets.CLOUDFLARE_API_TOKEN }}'
      #       printf 'CLOUDFLARE_ACCOUNT_ID=%s\n' '${{ secrets.CLOUDFLARE_ACCOUNT_ID }}'
      #       # Runtime credentials fetched from Infisical
      #       cat .infisical-env
      #     } > .worker-secrets
      #     rm -f .infisical-env
      # ------------------------------------------------------------------

      - name: Create Worker secrets file
        shell: bash
        run: |
          umask 077
          {
            printf 'CLOUDFLARE_API_TOKEN=%s\n' '${{ secrets.CLOUDFLARE_API_TOKEN }}'
            printf 'CLOUDFLARE_ACCOUNT_ID=%s\n' '${{ secrets.CLOUDFLARE_ACCOUNT_ID }}'
            printf 'NVIDIA_API_KEY=%s\n' '${{ secrets.NVIDIA_API_KEY }}'
            printf 'OPENROUTER_API_KEY=%s\n' '${{ secrets.OPENROUTER_API_KEY }}'
            printf 'ANALYTICS_ACCOUNT_ID=%s\n' '${{ secrets.ANALYTICS_ACCOUNT_ID }}'
            printf 'ANALYTICS_API_TOKEN=%s\n' '${{ secrets.ANALYTICS_API_TOKEN }}'
            printf 'METRICS_TOKEN=%s\n' '${{ secrets.METRICS_TOKEN }}'
            printf 'PROXY_API_KEY=%s\n' '${{ secrets.PROXY_API_KEY }}'
          } > .worker-secrets

      - name: Deploy to Cloudflare
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --env ${{ github.event.inputs.environment || 'staging' }} --secrets-file .worker-secrets

      - name: Remove Worker secrets file
        if: always()
        run: rm -f .worker-secrets

      - name: Health check
        if: ${{ steps.deploy.outputs.deployment-url != '' }}
        run: |
          HEALTH_URL="${{ steps.deploy.outputs.deployment-url }}/health"
          echo "Checking health at ${HEALTH_URL}..."
          curl -sf "${HEALTH_URL}" || (echo "Health check failed!" && exit 1)
