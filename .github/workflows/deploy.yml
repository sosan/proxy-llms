name: Deploy to Cloudflare

on:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: package.json
          cache: npm

      - name: Validate lockfile integrity
        run: npx lockfile-lint --path package-lock.json --type npm --allowed-hosts npm --validate-https --validate-integrity --validate-package-name --validate-checksum

      - name: Install dependencies (deterministic)
        run: npm ci --ignore-scripts --prefer-offline

      - name: Type check
        run: npm run typecheck

      - name: Run tests
        run: npm run test

      - name: Deploy to Cloudflare
        uses: cloudflare/wrangler-action
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
